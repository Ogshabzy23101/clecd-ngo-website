<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Centre for Life Enhancement and Community Development (CLECD), a Nigerian NGO supporting marginalised and vulnerable people."
    />
    <title>CLECD | Centre for Life Enhancement and Community Development</title>
  </head>
  <body>
    <!-- Netlify Forms detection fallback. Keep fields in sync with src/App.jsx. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/thank-you.html"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
