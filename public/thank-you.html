<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thank you for contacting Centre for Life Enhancement and Community Development."
    />
    <title>Thank You | CLECD</title>
    <style>
      :root {
        color: #24352d;
        background: #fffaf3;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      main {
        align-items: center;
        background:
          linear-gradient(90deg, rgba(18, 63, 49, 0.92), rgba(43, 104, 79, 0.7)),
          linear-gradient(135deg, #1d6f55, #d4934c);
        color: #ffffff;
        display: grid;
        min-height: 100vh;
        padding: clamp(2rem, 7vw, 5rem);
      }

      .message {
        max-width: 760px;
      }

      .brand {
        align-items: center;
        display: inline-flex;
        gap: 0.75rem;
        margin-bottom: 2rem;
        text-decoration: none;
      }

      .brand-mark {
        align-items: center;
        background: #ffffff;
        border-radius: 50%;
        display: inline-flex;
        height: 3.25rem;
        justify-content: center;
        overflow: hidden;
        width: 3.25rem;
      }

      .brand-mark img {
        display: block;
        height: 100%;
        object-fit: contain;
        width: 100%;
      }

      h1 {
        font-size: clamp(2.2rem, 8vw, 4.8rem);
        line-height: 1;
        margin: 0 0 1rem;
      }

      p {
        color: #f7f0e8;
        font-size: clamp(1rem, 2vw, 1.2rem);
        margin: 0 0 2rem;
      }

      a {
        color: inherit;
      }

      .button {
        background: #d4934c;
        border-radius: 8px;
        color: #17271f;
        display: inline-flex;
        font-weight: 800;
        min-height: 3rem;
        padding: 0.8rem 1.15rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="message" aria-labelledby="thank-you-title">
        <a class="brand" href="/">
          <span class="brand-mark">
            <img src="/images/clecd-logo.png" alt="CLECD logo" />
          </span>
          <strong>CLECD</strong>
        </a>
        <h1 id="thank-you-title">Thank you.</h1>
        <p>
          Thank you for contacting CLECD. Your message has been received and we
          will respond as soon as possible.
        </p>
        <a class="button" href="/">Return Home</a>
      </section>
    </main>
  </body>
</html>
